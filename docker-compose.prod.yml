services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    container_name: WheelsRUs_Frontend
    ports:
      - "5173:80"
    env_file:
      - ./Frontend/.env
  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    container_name: WheelsRUs_Backend
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
  mongodb:
    image: mongo:7
    container_name: summer-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

  redis:
    image: redis:7-alpine
    container_name: summer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
